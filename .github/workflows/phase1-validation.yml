name: Phase 1 Validation

on:
  push:
    branches:
      - phase-1-production-foundation
  pull_request:
    branches:
      - phase-1-production-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Phase 1 validation
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate migration files
        shell: bash
        run: |
          set -euo pipefail
          test -d prisma/migrations
          test -s prisma/migrations/00000000000000_init/migration.sql
          test -s prisma/migrations/migration_lock.toml

          echo "Checking initial migration-to-schema consistency without applying migrations or connecting to the database..."
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script \
            --output /tmp/expected-initial-migration.sql
          cmp -s /tmp/expected-initial-migration.sql prisma/migrations/00000000000000_init/migration.sql || {
            echo "ERROR: committed initial migration SQL does not exactly match the current Prisma schema."
            exit 1
          }

          if grep -Eiq '(^|[[:space:]])(DROP TABLE|DROP SCHEMA|TRUNCATE|DROP DATABASE|DELETE FROM)([[:space:];]|$)' prisma/migrations/00000000000000_init/migration.sql; then
            echo "ERROR: committed initial migration contains a destructive statement."
            exit 1
          fi
          echo "Initial migration is consistent with the schema and contains no destructive statement."

      - name: Verify PostgreSQL connection
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${DIRECT_URL:-}" ]; then
            echo "ERROR: GitHub Actions secrets DATABASE_URL and DIRECT_URL are required for database connection validation."
            echo "No database command that changes data is run by this workflow."
            exit 1
          fi

          npx prisma migrate status --schema=prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (if configured)
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            npm test
          else
            echo "No test script is configured; skipping tests."
          fi

      - name: Production build
        run: npm run build

      - name: Verify existing static website files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html product.html style.css main.js; do
            test -f "$file" || { echo "ERROR: existing website file missing: $file"; exit 1; }
          done
          test -d assets || { echo "ERROR: existing assets directory missing"; exit 1; }
          echo "Existing ValuVeda static website files and assets are present."

# Phase 1 validation only: this workflow never applies database migrations.
